<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Animal Seasons!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    transition: background .5s;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: clamp(6px, 1.5vh, 14px);
    padding: 8px;
  }

  h1 {
    font-size: clamp(1.3rem, 4.5vw, 2.4rem);
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,.3);
    text-align: center;
  }

  #score-bar {
    font-size: clamp(1.2rem, 3.5vw, 1.8rem);
    letter-spacing: 2px;
  }

  /* --- Scene --- */
  #scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  #season-icon {
    font-size: clamp(3rem, 8vw, 5rem);
    line-height: 1;
  }
  #season-name {
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,.3);
  }
  #animal-emoji {
    font-size: clamp(6rem, 20vw, 12rem);
    line-height: 1;
    transition: transform .3s;
  }
  #animal-name {
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    font-weight: 700;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,.3);
  }

  /* --- Action Buttons --- */
  #buttons {
    display: flex;
    gap: clamp(8px, 2vw, 18px);
    flex-wrap: wrap;
    justify-content: center;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: clamp(90px, 22vw, 165px);
    height: clamp(90px, 22vw, 165px);
    border: 5px solid rgba(255,255,255,.8);
    border-radius: 24px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .action-btn:active { transform: scale(.93); }
  .action-btn .btn-emoji {
    font-size: clamp(2.2rem, 6.5vw, 4rem);
    line-height: 1;
  }
  .action-btn .btn-label {
    font-size: clamp(.8rem, 2.3vw, 1.2rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,.3);
    margin-top: 3px;
    text-align: center;
  }

  .action-btn[data-action="sleep"]   { background: linear-gradient(135deg, #7e57c2, #b39ddb); box-shadow: 0 5px 16px rgba(126,87,194,.35); }
  .action-btn[data-action="eat"]     { background: linear-gradient(135deg, #66bb6a, #aed581); box-shadow: 0 5px 16px rgba(102,187,106,.35); }
  .action-btn[data-action="smell"]   { background: linear-gradient(135deg, #ec407a, #f48fb1); box-shadow: 0 5px 16px rgba(236,64,122,.35); }
  .action-btn[data-action="swim"]    { background: linear-gradient(135deg, #42a5f5, #26c6da); box-shadow: 0 5px 16px rgba(66,165,245,.35); }
  .action-btn[data-action="build"]   { background: linear-gradient(135deg, #ff9800, #ffb74d); box-shadow: 0 5px 16px rgba(255,152,0,.35); }
  .action-btn[data-action="sing"]    { background: linear-gradient(135deg, #ffd54f, #fff176); box-shadow: 0 5px 16px rgba(255,213,79,.35); }

  /* --- Reaction Overlay --- */
  #reaction {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(5rem, 20vw, 12rem);
    z-index: 2000;
    pointer-events: none;
    opacity: 0;
    transition: transform .25s ease, opacity .25s;
  }
  #reaction.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* --- Celebration --- */
  #celebration {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.5);
    z-index: 3000;
  }
  #celebration.show { display: flex; }
  #celebration .msg {
    font-size: clamp(1.8rem, 6vw, 4rem);
    color: #fff;
    font-weight: 900;
    text-shadow: 3px 3px 0 #6a1b9a;
    text-align: center;
    animation: pop .5s ease;
  }
  #celebration .big-stars {
    font-size: clamp(3rem, 10vw, 6rem);
    animation: pop .6s ease .15s both;
  }
  #play-again {
    margin-top: 25px;
    padding: 18px 50px;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ce93d8, #ffca28);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    animation: pop .6s ease .3s both;
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%  { transform: translateX(-20px); }
    40%  { transform: translateX(20px); }
    60%  { transform: translateX(-12px); }
    80%  { transform: translateX(12px); }
  }
  #animal-emoji.shake { animation: shake .4s ease; }

  .confetti {
    position: fixed;
    border-radius: 2px;
    z-index: 3001;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div id="game">
  <h1>What Does the Animal Do?</h1>
  <div id="score-bar"><span id="stars"></span></div>
  <div id="scene">
    <div id="season-icon"></div>
    <div id="season-name"></div>
    <div id="animal-emoji"></div>
    <div id="animal-name"></div>
  </div>
  <div id="buttons">
    <button class="action-btn" data-action="sleep">
      <span class="btn-emoji">😴</span>
      <span class="btn-label">Sleep!</span>
    </button>
    <button class="action-btn" data-action="eat">
      <span class="btn-emoji">😋</span>
      <span class="btn-label">Eat!</span>
    </button>
    <button class="action-btn" data-action="smell">
      <span class="btn-emoji">🌸</span>
      <span class="btn-label">Smell flowers!</span>
    </button>
    <button class="action-btn" data-action="swim">
      <span class="btn-emoji">💦</span>
      <span class="btn-label">Swim!</span>
    </button>
    <button class="action-btn" data-action="build">
      <span class="btn-emoji">🏠</span>
      <span class="btn-label">Build!</span>
    </button>
    <button class="action-btn" data-action="sing">
      <span class="btn-emoji">🎵</span>
      <span class="btn-label">Sing!</span>
    </button>
  </div>
</div>

<div id="reaction"></div>

<div id="celebration">
  <div class="big-stars">🎉🐻🎉</div>
  <div class="msg">Season Expert!</div>
  <div class="big-stars">⭐🌈⭐</div>
  <button id="play-again">Play Again!</button>
</div>

<script>
const SCENARIOS = [
  // SLEEP - winter hibernation
  { animal: '🐻', name: 'Bear',        season: 'winter', action: 'sleep'  },
  { animal: '🦔', name: 'Hedgehog',    season: 'winter', action: 'sleep'  },
  { animal: '🐢', name: 'Turtle',      season: 'winter', action: 'sleep'  },
  { animal: '🐸', name: 'Frog',        season: 'winter', action: 'sleep'  },

  // EAT - summer feast
  { animal: '🐰', name: 'Bunny',       season: 'summer', action: 'eat'    },
  { animal: '🐿️', name: 'Squirrel',   season: 'summer', action: 'eat'    },
  { animal: '🐝', name: 'Bee',         season: 'summer', action: 'eat'    },

  // SMELL FLOWERS - spring blooms
  { animal: '🦋', name: 'Butterfly',   season: 'spring', action: 'smell'  },
  { animal: '🐝', name: 'Bee',         season: 'spring', action: 'smell'  },
  { animal: '🐞', name: 'Ladybug',     season: 'spring', action: 'smell'  },

  // SWIM - summer splash
  { animal: '🐟', name: 'Fish',        season: 'summer', action: 'swim'   },
  { animal: '🦆', name: 'Duck',        season: 'summer', action: 'swim'   },
  { animal: '🐊', name: 'Alligator',   season: 'summer', action: 'swim'   },

  // BUILD - autumn prep
  { animal: '🐿️', name: 'Squirrel',   season: 'autumn', action: 'build'  },
  { animal: '🐦', name: 'Bird',        season: 'autumn', action: 'build'  },
  { animal: '🦫', name: 'Beaver',      season: 'autumn', action: 'build'  },

  // SING - spring songs
  { animal: '🐦', name: 'Bird',        season: 'spring', action: 'sing'   },
  { animal: '🐓', name: 'Rooster',     season: 'spring', action: 'sing'   },
  { animal: '🐸', name: 'Frog',        season: 'spring', action: 'sing'   },
];

const SEASONS = {
  winter: { icon: '❄️',  name: 'Winter',  bg: 'linear-gradient(135deg, #90caf9 0%, #e1bee7 50%, #b0bec5 100%)' },
  spring: { icon: '🌷',  name: 'Spring',  bg: 'linear-gradient(135deg, #c8e6c9 0%, #f8bbd0 50%, #fff9c4 100%)' },
  summer: { icon: '☀️',  name: 'Summer',  bg: 'linear-gradient(135deg, #fff9c4 0%, #ffe0b2 50%, #ffccbc 100%)' },
  autumn: { icon: '🍂',  name: 'Autumn',  bg: 'linear-gradient(135deg, #ffe0b2 0%, #ffcc80 50%, #d7ccc8 100%)' },
};

const REACTIONS = {
  sleep:  ['💤', '😴', '🌙'],
  eat:    ['😋', '🤤', '🍽️'],
  smell:  ['🌸', '🌺', '😊'],
  swim:   ['💦', '🐳', '🌊'],
  build:  ['🏠', '🔨', '👏'],
  sing:   ['🎵', '🎶', '🎤'],
};

const ROUNDS = 10;
let queue = [];
let round = 0;
let waiting = false;

const seasonIcon  = document.getElementById('season-icon');
const seasonName  = document.getElementById('season-name');
const animalEmoji = document.getElementById('animal-emoji');
const animalName  = document.getElementById('animal-name');
const starsEl     = document.getElementById('stars');
const reactionEl  = document.getElementById('reaction');
const celebrationEl = document.getElementById('celebration');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueue() {
  const byAction = {};
  SCENARIOS.forEach(s => {
    if (!byAction[s.action]) byAction[s.action] = [];
    byAction[s.action].push(s);
  });
  const picks = Object.values(byAction).map(arr => arr[Math.floor(Math.random() * arr.length)]);
  const rest = shuffle(SCENARIOS.filter(s => !picks.includes(s)));
  return shuffle([...picks, ...rest.slice(0, ROUNDS - picks.length)]);
}

function startGame() {
  round = 0;
  queue = buildQueue();
  starsEl.textContent = '';
  celebrationEl.classList.remove('show');
  waiting = false;
  showNext();
}

function showNext() {
  if (round >= ROUNDS) {
    celebrationEl.classList.add('show');
    spawnConfetti();
    return;
  }
  const s = queue[round];
  const season = SEASONS[s.season];
  document.body.style.background = season.bg;
  seasonIcon.textContent = season.icon;
  seasonName.textContent = "It's " + season.name + "!";
  animalEmoji.textContent = s.animal;
  animalEmoji.style.transform = 'scale(0)';
  animalName.textContent = s.name;
  requestAnimationFrame(() => {
    animalEmoji.style.transform = 'scale(1)';
  });
}

function handleAction(action) {
  if (waiting) return;
  waiting = true;
  const s = queue[round];

  if (action === s.action) {
    starsEl.textContent += '⭐';
    const pool = REACTIONS[action];
    showReaction(pool[Math.floor(Math.random() * pool.length)]);
    round++;
    setTimeout(() => {
      waiting = false;
      showNext();
    }, 1000);
  } else {
    showReaction('🙈');
    animalEmoji.classList.add('shake');
    animalEmoji.addEventListener('animationend', () => animalEmoji.classList.remove('shake'), { once: true });
    setTimeout(() => { waiting = false; }, 600);
  }
}

function showReaction(emoji) {
  reactionEl.textContent = emoji;
  reactionEl.classList.add('show');
  setTimeout(() => reactionEl.classList.remove('show'), 800);
}

function spawnConfetti() {
  const colors = ['#ce93d8','#ffca28','#66bb6a','#42a5f5','#ff7043','#f48fb1'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = -20 + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * .8) + 's';
    c.style.width = (8 + Math.random() * 10) + 'px';
    c.style.height = (8 + Math.random() * 10) + 'px';
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

document.querySelectorAll('.action-btn').forEach(btn => {
  btn.addEventListener('click', () => handleAction(btn.dataset.action));
});
document.getElementById('play-again').addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
