<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>What Do You Do?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #fff9c4 50%, #e0f7fa 100%);
    user-select: none;
    -webkit-user-select: none;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: clamp(10px, 2vh, 20px);
    padding: 10px;
  }

  h1 {
    font-size: clamp(1.4rem, 5vw, 2.6rem);
    color: #5d4037;
    text-shadow: 2px 2px 0 #fff;
    text-align: center;
  }

  /* --- Animal Display --- */
  #animal-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  #animal-emoji {
    font-size: clamp(7rem, 25vw, 14rem);
    line-height: 1;
    transition: transform .3s;
  }
  #animal-name {
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    font-weight: 800;
    color: #4e342e;
  }

  /* --- Action Buttons --- */
  #buttons {
    display: flex;
    gap: clamp(10px, 3vw, 25px);
    flex-wrap: wrap;
    justify-content: center;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: clamp(110px, 28vw, 200px);
    height: clamp(110px, 28vw, 200px);
    border: 5px solid #fff;
    border-radius: 28px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .action-btn:active { transform: scale(.95); }
  .action-btn .btn-emoji {
    font-size: clamp(2.8rem, 8vw, 5rem);
    line-height: 1;
  }
  .action-btn .btn-label {
    font-size: clamp(1rem, 3vw, 1.5rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,.3);
    margin-top: 4px;
  }

  .action-btn[data-action="run"] {
    background: linear-gradient(135deg, #ef5350, #ff7043);
    box-shadow: 0 6px 20px rgba(239,83,80,.35);
  }
  .action-btn[data-action="pet"] {
    background: linear-gradient(135deg, #66bb6a, #81c784);
    box-shadow: 0 6px 20px rgba(102,187,106,.35);
  }
  .action-btn[data-action="swim"] {
    background: linear-gradient(135deg, #42a5f5, #26c6da);
    box-shadow: 0 6px 20px rgba(66,165,245,.35);
  }

  /* --- Score --- */
  #score-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    font-weight: 700;
    color: #6d4c41;
  }
  #stars { font-size: clamp(1.4rem, 4vw, 2rem); letter-spacing: 2px; }

  /* --- Reaction Overlay --- */
  #reaction {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(6rem, 22vw, 14rem);
    z-index: 2000;
    pointer-events: none;
    opacity: 0;
    transition: transform .25s ease, opacity .25s;
  }
  #reaction.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* --- Celebration --- */
  #celebration {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.5);
    z-index: 3000;
  }
  #celebration.show { display: flex; }
  #celebration .msg {
    font-size: clamp(2rem, 7vw, 4.5rem);
    color: #fff;
    font-weight: 900;
    text-shadow: 3px 3px 0 #ff6f00;
    text-align: center;
    animation: pop .5s ease;
  }
  #celebration .big-stars {
    font-size: clamp(3rem, 10vw, 6rem);
    animation: pop .6s ease .15s both;
  }
  #celebration .final-score {
    font-size: clamp(1.3rem, 4vw, 2rem);
    color: #fff;
    margin-top: 10px;
    animation: pop .6s ease .2s both;
  }
  #play-again {
    margin-top: 25px;
    padding: 18px 50px;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff8a65, #ffca28);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    animation: pop .6s ease .3s both;
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* shake on wrong answer */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%  { transform: translateX(-20px); }
    40%  { transform: translateX(20px); }
    60%  { transform: translateX(-12px); }
    80%  { transform: translateX(12px); }
  }
  #animal-emoji.shake { animation: shake .4s ease; }

  /* --- Confetti --- */
  .confetti {
    position: fixed;
    border-radius: 2px;
    z-index: 3001;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div id="game">
  <h1>What Do You Do?</h1>
  <div id="score-bar">
    <span id="stars"></span>
  </div>
  <div id="animal-area">
    <div id="animal-emoji"></div>
    <div id="animal-name"></div>
  </div>
  <div id="buttons">
    <button class="action-btn" data-action="run">
      <span class="btn-emoji">🏃</span>
      <span class="btn-label">Run!</span>
    </button>
    <button class="action-btn" data-action="pet">
      <span class="btn-emoji">🤗</span>
      <span class="btn-label">Pet it!</span>
    </button>
    <button class="action-btn" data-action="swim">
      <span class="btn-emoji">🏊</span>
      <span class="btn-label">Swim away!</span>
    </button>
  </div>
</div>

<div id="reaction"></div>

<div id="celebration">
  <div class="big-stars">🎉🏆🎉</div>
  <div class="msg">All Done!</div>
  <div class="final-score" id="final-score"></div>
  <button id="play-again">Play Again!</button>
</div>

<script>
const ANIMALS = [
  // RUN - scary!
  { emoji: '🦁', name: 'Lion',       action: 'run'  },
  { emoji: '🐻', name: 'Bear',       action: 'run'  },
  { emoji: '🐯', name: 'Tiger',      action: 'run'  },
  { emoji: '🐺', name: 'Wolf',       action: 'run'  },
  { emoji: '🦍', name: 'Gorilla',    action: 'run'  },
  // PET - friendly!
  { emoji: '🐱', name: 'Cat',        action: 'pet'  },
  { emoji: '🐶', name: 'Dog',        action: 'pet'  },
  { emoji: '🐰', name: 'Bunny',      action: 'pet'  },
  { emoji: '🐹', name: 'Hamster',    action: 'pet'  },
  { emoji: '🐴', name: 'Horse',      action: 'pet'  },
  // SWIM AWAY - water danger!
  { emoji: '🐊', name: 'Alligator',  action: 'swim' },
  { emoji: '🦈', name: 'Shark',      action: 'swim' },
  { emoji: '🐙', name: 'Octopus',    action: 'swim' },
];

const ROUNDS = 10;
let queue = [];
let round = 0;
let score = 0;
let waiting = false;

const animalEmoji = document.getElementById('animal-emoji');
const animalName  = document.getElementById('animal-name');
const starsEl     = document.getElementById('stars');
const reactionEl  = document.getElementById('reaction');
const celebrationEl = document.getElementById('celebration');
const finalScoreEl  = document.getElementById('final-score');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueue() {
  // Ensure at least one of each action, fill rest randomly
  const byAction = { run: [], pet: [], swim: [] };
  ANIMALS.forEach(a => byAction[a.action].push(a));
  const picks = [
    byAction.run[Math.floor(Math.random() * byAction.run.length)],
    byAction.pet[Math.floor(Math.random() * byAction.pet.length)],
    byAction.swim[Math.floor(Math.random() * byAction.swim.length)],
  ];
  const rest = shuffle(ANIMALS).filter(a => !picks.includes(a));
  const pool = shuffle([...picks, ...rest.slice(0, ROUNDS - 3)]);
  return pool;
}

function startGame() {
  round = 0;
  score = 0;
  queue = buildQueue();
  starsEl.textContent = '';
  celebrationEl.classList.remove('show');
  waiting = false;
  showNext();
}

function showNext() {
  if (round >= ROUNDS) {
    endGame();
    return;
  }
  const animal = queue[round];
  animalEmoji.textContent = animal.emoji;
  animalEmoji.style.transform = 'scale(0)';
  animalName.textContent = animal.name;
  requestAnimationFrame(() => {
    animalEmoji.style.transform = 'scale(1)';
  });
}

function handleAction(action) {
  if (waiting) return;
  waiting = true;
  const animal = queue[round];
  const correct = action === animal.action;

  if (correct) {
    score++;
    starsEl.textContent += '⭐';
    showReaction('😄');
  } else {
    starsEl.textContent += '·';
    showReaction('😢');
    animalEmoji.classList.add('shake');
    animalEmoji.addEventListener('animationend', () => animalEmoji.classList.remove('shake'), { once: true });
  }

  round++;
  setTimeout(() => {
    waiting = false;
    showNext();
  }, 1000);
}

function showReaction(emoji) {
  reactionEl.textContent = emoji;
  reactionEl.classList.add('show');
  setTimeout(() => reactionEl.classList.remove('show'), 800);
}

function endGame() {
  finalScoreEl.textContent = `You got ${score} out of ${ROUNDS}!`;
  celebrationEl.classList.add('show');
  if (score >= 7) spawnConfetti();
}

function spawnConfetti() {
  const colors = ['#ff8a65','#ffca28','#66bb6a','#42a5f5','#ab47bc','#ef5350'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = -20 + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * .8) + 's';
    c.style.width = (8 + Math.random() * 10) + 'px';
    c.style.height = (8 + Math.random() * 10) + 'px';
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

// Button listeners
document.querySelectorAll('.action-btn').forEach(btn => {
  btn.addEventListener('click', () => handleAction(btn.dataset.action));
});

document.getElementById('play-again').addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
