<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dragon Cave!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #2b1055 0%, #3b2063 45%, #4a148c 100%);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: clamp(6px, 1.6vh, 16px);
    padding: 8px;
  }

  h1 {
    font-size: clamp(1.3rem, 4.5vw, 2.4rem);
    color: #ffd54f;
    text-shadow: 2px 2px 0 #4a148c, 0 0 18px rgba(255,213,79,.5);
    text-align: center;
  }

  #score-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: clamp(1rem, 3.2vw, 1.5rem);
    font-weight: 800;
    color: #fff;
  }
  #score-bar .pill {
    background: rgba(255,255,255,.12);
    padding: 4px 16px;
    border-radius: 40px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* --- Cave grid --- */
  #cave {
    display: grid;
    gap: 3px;
    padding: clamp(6px, 1.6vw, 14px);
    background: #1a0b33;
    border: 4px solid #6a1b9a;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 40px rgba(0,0,0,.6);
  }

  .cell {
    width: clamp(28px, 8.5vw, 62px);
    height: clamp(28px, 8.5vw, 62px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 5.2vw, 38px);
    line-height: 1;
    border-radius: 8px;
    background: #4e2a84;
    transition: filter .18s, background .18s, transform .12s;
    position: relative;
  }
  .cell.wall {
    background: #241243;
    box-shadow: inset 0 3px 6px rgba(0,0,0,.5);
  }
  /* Fog of war: cells the dragon hasn't reached stay dark */
  .cell.dark {
    filter: brightness(.28) saturate(.4);
  }
  .cell.dark .item { opacity: 0; }
  .cell .item { transition: opacity .2s, transform .2s; }

  .cell.dragon {
    background: radial-gradient(circle, #ffb300 0%, #6a1b9a 70%);
    box-shadow: 0 0 22px rgba(255,193,7,.8);
  }
  .cell.dragon .dragon-emoji { animation: bob 1s ease-in-out infinite; }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-3px); }
  }
  .cell.pop { animation: cellpop .35s ease; }
  @keyframes cellpop {
    0% { transform: scale(1); }
    50% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }

  /* --- D-pad --- */
  #controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: clamp(6px, 1.5vw, 12px);
    margin-top: 4px;
  }
  .dpad {
    width: clamp(56px, 15vw, 84px);
    height: clamp(56px, 15vw, 84px);
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #ab47bc, #7e57c2);
    color: #fff;
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    cursor: pointer;
    box-shadow: 0 5px 0 #4a148c, 0 8px 16px rgba(0,0,0,.4);
    transition: transform .08s, box-shadow .08s;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dpad:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #4a148c, 0 3px 8px rgba(0,0,0,.4);
  }
  #btn-up    { grid-column: 2; grid-row: 1; }
  #btn-left  { grid-column: 1; grid-row: 2; }
  #btn-down  { grid-column: 2; grid-row: 2; }
  #btn-right { grid-column: 3; grid-row: 2; }

  .hint {
    font-size: clamp(.8rem, 2.4vw, 1.05rem);
    color: #d1c4e9;
    text-align: center;
  }

  /* --- Celebration --- */
  #celebration {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(20,0,40,.72);
    z-index: 3000;
    text-align: center;
    padding: 20px;
  }
  #celebration.show { display: flex; }
  #celebration .big-stars {
    font-size: clamp(3rem, 12vw, 6.5rem);
    animation: pop .6s ease;
  }
  #celebration .msg {
    font-size: clamp(1.8rem, 6.5vw, 4rem);
    color: #ffd54f;
    font-weight: 900;
    text-shadow: 3px 3px 0 #4a148c;
    margin: 6px 0;
    animation: pop .5s ease .1s both;
  }
  #celebration .sub {
    font-size: clamp(1rem, 3.5vw, 1.6rem);
    color: #fff;
    animation: pop .5s ease .2s both;
  }
  #play-again {
    margin-top: 25px;
    padding: 18px 50px;
    font-size: clamp(1.4rem, 4.5vw, 2.2rem);
    font-weight: 800;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ffca28, #ff7043);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
    animation: pop .6s ease .3s both;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .confetti {
    position: fixed;
    border-radius: 2px;
    z-index: 3001;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div id="game">
  <h1>🐉 Dragon Cave</h1>
  <div id="score-bar">
    <span class="pill">💎 <span id="gem-count">0</span>/<span id="gem-total">0</span></span>
    <span class="pill">🗺️ Level <span id="level">1</span></span>
  </div>

  <div id="cave"></div>

  <div id="controls">
    <button class="dpad" id="btn-up" aria-label="Up">⬆️</button>
    <button class="dpad" id="btn-left" aria-label="Left">⬅️</button>
    <button class="dpad" id="btn-down" aria-label="Down">⬇️</button>
    <button class="dpad" id="btn-right" aria-label="Right">➡️</button>
  </div>

  <div class="hint">Move the dragon 🐉 with the arrows. Grab every 💎, then fly into the exit 🚪!</div>
</div>

<div id="celebration">
  <div class="big-stars">🎉🐉🎉</div>
  <div class="msg" id="cel-msg">You did it!</div>
  <div class="sub" id="cel-sub">You found all the treasure!</div>
  <div class="big-stars">⭐🏆⭐</div>
  <button id="play-again">Next Cave!</button>
</div>

<script>
const ROWS = 9;
const COLS = 9;

const caveEl   = document.getElementById('cave');
const gemCountEl = document.getElementById('gem-count');
const gemTotalEl = document.getElementById('gem-total');
const levelEl  = document.getElementById('level');
const celebrationEl = document.getElementById('celebration');
const celMsg = document.getElementById('cel-msg');
const celSub = document.getElementById('cel-sub');

// Cell types
const FLOOR = 0, WALL = 1;

let grid = [];        // FLOOR / WALL
let items = [];       // 'gem' | 'exit' | null  per cell
let seen = [];        // fog: revealed cells
let dragon = { r: 0, c: 0 };
let gemsCollected = 0;
let gemsTotal = 0;
let level = 1;
let exitOpen = false;
let busy = false;

function idx(r, c) { return r * COLS + c; }
function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

// Random maze: carve floors with a randomized DFS from the start cell so the
// whole cave is always fully connected (every gem is reachable).
function generateCave() {
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(WALL));
  const start = { r: ROWS - 1, c: 0 };

  // Carve on odd/even lattice so walls sit between corridors.
  function carve(r, c) {
    grid[r][c] = FLOOR;
    const dirs = shuffle([[0, 2], [0, -2], [2, 0], [-2, 0]]);
    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (inBounds(nr, nc) && grid[nr][nc] === WALL) {
        grid[r + dr / 2][c + dc / 2] = FLOOR;
        carve(nr, nc);
      }
    }
  }
  carve(start.r, start.c);

  // Knock out some extra walls so it feels open and cave-like, not a tight maze.
  for (let r = 1; r < ROWS - 1; r++) {
    for (let c = 1; c < COLS - 1; c++) {
      if (grid[r][c] === WALL && Math.random() < 0.16) grid[r][c] = FLOOR;
    }
  }

  dragon = { ...start };

  // Only cells reachable from the start are valid item spots. The wall-knockout
  // step above can occasionally strand a lone floor pocket, so we BFS to be sure
  // every gem and the exit can actually be walked to.
  const reachable = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  const queue = [start];
  reachable[start.r][start.c] = true;
  while (queue.length) {
    const { r, c } = queue.pop();
    for (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
      const nr = r + dr, nc = c + dc;
      if (inBounds(nr, nc) && grid[nr][nc] === FLOOR && !reachable[nr][nc]) {
        reachable[nr][nc] = true;
        queue.push({ r: nr, c: nc });
      }
    }
  }

  // Collect all reachable floor cells (skip start) for placing gems + exit.
  const floors = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (reachable[r][c] && !(r === start.r && c === start.c))
        floors.push({ r, c });

  shuffle(floors);

  items = Array.from({ length: ROWS }, () => Array(COLS).fill(null));

  // Exit goes on a far cell (top area), gems scale gently with the level.
  const far = floors
    .slice()
    .sort((a, b) => (a.r + (COLS - a.c)) - (b.r + (COLS - b.c)))[0];
  items[far.r][far.c] = 'exit';

  gemsTotal = Math.min(3 + level, 8);
  let placed = 0;
  for (const f of floors) {
    if (placed >= gemsTotal) break;
    if (items[f.r][f.c]) continue;
    items[f.r][f.c] = 'gem';
    placed++;
  }
  gemsTotal = placed;

  gemsCollected = 0;
  exitOpen = false;
  seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  reveal(dragon.r, dragon.c);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Light up the dragon's cell and its immediate neighbours (torch glow).
function reveal(r, c) {
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++)
      if (inBounds(r + dr, c + dc)) seen[r + dr][c + dc] = true;
}

function render() {
  caveEl.style.gridTemplateColumns = `repeat(${COLS}, auto)`;
  caveEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;

      if (grid[r][c] === WALL) cell.classList.add('wall');
      if (!seen[r][c]) cell.classList.add('dark');

      let content = '';
      if (r === dragon.r && c === dragon.c) {
        cell.classList.add('dragon');
        content = '<span class="item dragon-emoji">🐉</span>';
      } else if (grid[r][c] === WALL) {
        content = '<span class="item">🪨</span>';
      } else if (items[r][c] === 'gem') {
        content = '<span class="item">💎</span>';
      } else if (items[r][c] === 'exit') {
        content = exitOpen
          ? '<span class="item">🚪</span>'
          : '<span class="item">🔒</span>';
      }
      cell.innerHTML = content;
      caveEl.appendChild(cell);
    }
  }
  gemCountEl.textContent = gemsCollected;
  gemTotalEl.textContent = gemsTotal;
  levelEl.textContent = level;
}

function cellAt(r, c) {
  return caveEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function move(dr, dc) {
  if (busy) return;
  const nr = dragon.r + dr, nc = dragon.c + dc;
  if (!inBounds(nr, nc) || grid[nr][nc] === WALL) {
    // Little nudge feedback when bumping a wall.
    const cur = cellAt(dragon.r, dragon.c);
    if (cur) { cur.classList.remove('pop'); void cur.offsetWidth; cur.classList.add('pop'); }
    return;
  }

  dragon = { r: nr, c: nc };
  reveal(nr, nc);

  const here = items[nr][nc];
  if (here === 'gem') {
    items[nr][nc] = null;
    gemsCollected++;
    sparkle(nr, nc);
    if (gemsCollected >= gemsTotal) exitOpen = true;
  } else if (here === 'exit' && exitOpen) {
    render();
    win();
    return;
  }

  render();
  const cell = cellAt(nr, nc);
  if (cell) { cell.classList.add('pop'); }
}

function sparkle(r, c) {
  const cell = cellAt(r, c);
  if (!cell) return;
  const colors = ['#ffd54f', '#4dd0e1', '#f06292', '#aed581', '#ff8a65'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.textContent = '✨';
    s.style.position = 'fixed';
    const rect = cell.getBoundingClientRect();
    s.style.left = (rect.left + rect.width / 2) + 'px';
    s.style.top = (rect.top + rect.height / 2) + 'px';
    s.style.fontSize = (10 + Math.random() * 14) + 'px';
    s.style.pointerEvents = 'none';
    s.style.zIndex = 2500;
    s.style.color = colors[Math.floor(Math.random() * colors.length)];
    document.body.appendChild(s);
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 45;
    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
    s.animate([
      { transform: 'translate(-50%,-50%) scale(0)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2)`, opacity: 0 }
    ], { duration: 650, easing: 'ease-out' }).onfinish = () => s.remove();
  }
}

function win() {
  busy = true;
  celMsg.textContent = pick(['You did it!', 'Cave cleared!', 'Treasure found!', 'Amazing!']);
  celSub.textContent = `You collected all ${gemsTotal} gems! 💎`;
  celebrationEl.classList.add('show');
  spawnConfetti();
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function nextLevel() {
  level++;
  celebrationEl.classList.remove('show');
  busy = false;
  generateCave();
  render();
}

function spawnConfetti() {
  const colors = ['#ffd54f','#ff7043','#42a5f5','#ab47bc','#66bb6a','#ec407a'];
  for (let i = 0; i < 90; i++) {
    const cf = document.createElement('div');
    cf.className = 'confetti';
    cf.style.left = Math.random() * 100 + 'vw';
    cf.style.background = colors[Math.floor(Math.random() * colors.length)];
    cf.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    cf.style.animationDelay = (Math.random() * .8) + 's';
    cf.style.width = (8 + Math.random() * 10) + 'px';
    cf.style.height = (8 + Math.random() * 10) + 'px';
    document.body.appendChild(cf);
    cf.addEventListener('animationend', () => cf.remove());
  }
}

// --- Input ---
document.getElementById('btn-up').addEventListener('click', () => move(-1, 0));
document.getElementById('btn-down').addEventListener('click', () => move(1, 0));
document.getElementById('btn-left').addEventListener('click', () => move(0, -1));
document.getElementById('btn-right').addEventListener('click', () => move(0, 1));
document.getElementById('play-again').addEventListener('click', nextLevel);

document.addEventListener('keydown', (e) => {
  const map = {
    ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
    w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1],
  };
  const m = map[e.key];
  if (m) { e.preventDefault(); move(m[0], m[1]); }
});

// Swipe support on the cave.
let touchStart = null;
caveEl.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
caveEl.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
  else move(dy > 0 ? 1 : -1, 0);
}, { passive: true });

generateCave();
render();
</script>
</body>
</html>
