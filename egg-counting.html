<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mixing Bowl!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fff9c4 0%, #ffe0b2 50%, #ffccbc 100%);
    user-select: none;
    -webkit-user-select: none;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: clamp(8px, 1.5vh, 16px);
    padding: 10px;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2.8rem);
    color: #e65100;
    text-shadow: 2px 2px 0 #fff;
  }

  #ingredient-label {
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    font-weight: 800;
    color: #6d4c41;
    text-align: center;
  }

  /* --- Number Selector --- */
  #selector {
    display: flex;
    align-items: center;
    gap: clamp(12px, 3vw, 24px);
  }
  .sel-btn {
    width: clamp(64px, 14vw, 100px);
    height: clamp(64px, 14vw, 100px);
    border: none;
    border-radius: 50%;
    font-size: clamp(2.5rem, 7vw, 4rem);
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .1s;
    -webkit-tap-highlight-color: transparent;
    line-height: 1;
  }
  .sel-btn:active { transform: scale(.9); }
  #btn-minus { background: linear-gradient(135deg, #ef5350, #ff7043); box-shadow: 0 4px 12px rgba(239,83,80,.35); }
  #btn-plus  { background: linear-gradient(135deg, #66bb6a, #81c784); box-shadow: 0 4px 12px rgba(102,187,106,.35); }
  #num-display {
    font-size: clamp(4rem, 12vw, 7rem);
    font-weight: 900;
    color: #e65100;
    min-width: 1.2em;
    text-align: center;
    text-shadow: 2px 2px 0 #fff;
  }

  /* --- Bowl Area --- */
  #bowl-area {
    position: relative;
    width: clamp(200px, 50vw, 380px);
    height: clamp(160px, 35vw, 280px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  #bowl {
    font-size: clamp(8rem, 28vw, 16rem);
    line-height: 1;
    position: relative;
    z-index: 1;
  }

  #eggs-in-bowl {
    position: absolute;
    bottom: clamp(40px, 10vw, 80px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2px;
    width: 60%;
    z-index: 2;
    pointer-events: none;
  }
  .bowl-egg {
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    animation: popIn .3s ease;
  }
  @keyframes popIn {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* --- Floating Egg --- */
  #floating-egg {
    position: fixed;
    font-size: clamp(3rem, 9vw, 5.5rem);
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: none;
  }

  /* --- Waiting Egg --- */
  #egg-waiting {
    font-size: clamp(4rem, 12vw, 7rem);
    position: absolute;
    right: -clamp(50px, 14vw, 90px);
    bottom: 0;
    z-index: 0;
    transition: opacity .3s;
  }

  /* --- Counter Display --- */
  #counter {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 900;
    color: #e65100;
    text-shadow: 3px 3px 0 #fff;
    min-height: 1.3em;
    text-align: center;
  }

  /* --- GO Button --- */
  #go-btn {
    padding: clamp(14px, 3vh, 22px) clamp(50px, 12vw, 90px);
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 900;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff6f00, #ffa726);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,111,0,.4);
    transition: transform .15s;
    -webkit-tap-highlight-color: transparent;
  }
  #go-btn:active { transform: scale(.95); }
  #go-btn:disabled {
    opacity: .5;
    cursor: default;
  }
  #go-btn:disabled:active { transform: none; }

  /* --- Celebration --- */
  #celebration {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.45);
    z-index: 3000;
  }
  #celebration.show { display: flex; }
  #celebration .chef {
    font-size: clamp(5rem, 16vw, 10rem);
    animation: pop .5s ease;
  }
  #celebration .msg {
    font-size: clamp(1.8rem, 6vw, 3.5rem);
    color: #fff;
    font-weight: 900;
    text-shadow: 3px 3px 0 #e65100;
    text-align: center;
    animation: pop .5s ease .1s both;
    margin-top: 10px;
  }
  #cook-again {
    margin-top: 25px;
    padding: 18px 50px;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff6f00, #ffca28);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    animation: pop .6s ease .25s both;
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .confetti {
    position: fixed;
    border-radius: 2px;
    z-index: 3001;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div id="game">
  <h1>🥣 Mixing Bowl!</h1>

  <div id="ingredient-label"></div>

  <div id="selector">
    <button class="sel-btn" id="btn-minus">−</button>
    <div id="num-display">3</div>
    <button class="sel-btn" id="btn-plus">+</button>
  </div>

  <div id="bowl-area">
    <div id="egg-waiting"></div>
    <div id="eggs-in-bowl"></div>
    <div id="bowl">🥣</div>
  </div>

  <div id="counter"></div>

  <button id="go-btn">GO!</button>
</div>

<div id="floating-egg"></div>

<div id="celebration">
  <div class="chef">👨‍🍳</div>
  <div class="msg" id="cel-msg"></div>
  <button id="cook-again">Cook Again!</button>
</div>

<script>
// --- Audio: generate plop sound via Web Audio API ---
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playPlop() {
  initAudio();
  const ctx = audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(300, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.6, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.25);
}

function playTada() {
  initAudio();
  const ctx = audioCtx;
  const notes = [523, 659, 784];
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'triangle';
    const t = ctx.currentTime + i * 0.15;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.4, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
    osc.start(t);
    osc.stop(t + 0.4);
  });
}

// --- Ingredients ---
const INGREDIENTS = [
  { emoji: '🥚', name: 'Eggs' },
  { emoji: '🍞', name: 'Bread' },
  { emoji: '🍗', name: 'Chicken' },
  { emoji: '🧈', name: 'Butter' },
];

let ingredientIndex = 0;
let recipe = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startRecipe() {
  recipe = shuffle(INGREDIENTS);
  ingredientIndex = 0;
  eggsInBowl.innerHTML = '';
  showIngredient();
}

function showIngredient() {
  const ing = recipe[ingredientIndex];
  ingredientLabel.textContent = `Add some ${ing.name}! ${ing.emoji}`;
  eggWaiting.textContent = ing.emoji;
  floatingEgg.textContent = ing.emoji;
  count = 3;
  numDisplay.textContent = count;
  counterEl.textContent = '';
  running = false;
  goBtn.disabled = false;
  btnMinus.disabled = false;
  btnPlus.disabled = false;
}

// --- Elements ---
const ingredientLabel = document.getElementById('ingredient-label');
const numDisplay   = document.getElementById('num-display');
const btnMinus     = document.getElementById('btn-minus');
const btnPlus      = document.getElementById('btn-plus');
const goBtn        = document.getElementById('go-btn');
const bowlArea     = document.getElementById('bowl-area');
const eggsInBowl   = document.getElementById('eggs-in-bowl');
const eggWaiting   = document.getElementById('egg-waiting');
const floatingEgg  = document.getElementById('floating-egg');
const counterEl    = document.getElementById('counter');
const celebrationEl = document.getElementById('celebration');
const celMsg       = document.getElementById('cel-msg');
const cookAgain    = document.getElementById('cook-again');

let count = 3;
let running = false;

// --- Selector ---
btnMinus.addEventListener('click', () => {
  if (running || count <= 1) return;
  count--;
  numDisplay.textContent = count;
});
btnPlus.addEventListener('click', () => {
  if (running || count >= 9) return;
  count++;
  numDisplay.textContent = count;
});

// --- GO ---
goBtn.addEventListener('click', () => {
  if (running) return;
  initAudio();
  running = true;
  goBtn.disabled = true;
  btnMinus.disabled = true;
  btnPlus.disabled = true;
  counterEl.textContent = '';
  dropItems(count);
});

async function dropItems(total) {
  const ing = recipe[ingredientIndex];
  const bowlRect = bowlArea.getBoundingClientRect();
  const bowlCenterX = bowlRect.left + bowlRect.width / 2;
  const bowlTopY = bowlRect.top + bowlRect.height * 0.25;

  const waitRect = eggWaiting.getBoundingClientRect();
  const startX = waitRect.left + waitRect.width / 2;
  const startY = waitRect.top + waitRect.height / 2;

  for (let i = 1; i <= total; i++) {
    await animateDrop(startX, startY, bowlCenterX, bowlTopY, i, total, ing.emoji);
    await sleep(400);
  }

  // Move to next ingredient or celebrate
  ingredientIndex++;
  if (ingredientIndex < recipe.length) {
    setTimeout(() => showIngredient(), 600);
  } else {
    setTimeout(() => {
      playTada();
      const summary = recipe.map(r => r.emoji).join(' ');
      celMsg.textContent = `You mixed ${summary}\nTime to cook!`;
      celebrationEl.classList.add('show');
      spawnConfetti();
    }, 400);
  }
}

function animateDrop(fromX, fromY, toX, toY, num, total, emoji) {
  return new Promise(resolve => {
    const el = floatingEgg;
    const eW = el.offsetWidth / 2;
    const eH = el.offsetHeight / 2;

    el.style.transition = 'none';
    el.style.left = (fromX - eW) + 'px';
    el.style.top = (fromY - eH) + 'px';
    el.style.opacity = '1';

    requestAnimationFrame(() => {
      el.style.transition = 'left 0.4s ease-in, top 0.4s ease-in';
      el.style.left = (toX - eW) + 'px';
      el.style.top = (toY - eH) + 'px';
    });

    setTimeout(() => {
      el.style.opacity = '0';
      playPlop();

      const e = document.createElement('span');
      e.className = 'bowl-egg';
      e.textContent = emoji;
      eggsInBowl.appendChild(e);

      counterEl.textContent = num + (num < total ? '...' : '!');

      resolve();
    }, 450);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// --- Cook Again ---
cookAgain.addEventListener('click', () => {
  celebrationEl.classList.remove('show');
  startRecipe();
});

startRecipe();

function spawnConfetti() {
  const colors = ['#ff6f00','#ffca28','#66bb6a','#42a5f5','#ab47bc','#ef5350'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = -20 + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * .8) + 's';
    c.style.width = (8 + Math.random() * 10) + 'px';
    c.style.height = (8 + Math.random() * 10) + 'px';
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}
</script>
</body>
</html>
