<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Animal Chef!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fff9c4 0%, #c8e6c9 50%, #ffe0b2 100%);
    user-select: none;
    -webkit-user-select: none;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: clamp(6px, 1.2vh, 14px);
    padding: 8px;
  }

  h1 {
    font-size: clamp(1.3rem, 4.5vw, 2.4rem);
    color: #e65100;
    text-shadow: 2px 2px 0 #fff;
  }

  #progress {
    font-size: clamp(1rem, 3vw, 1.4rem);
    letter-spacing: 2px;
  }

  /* --- Animal Area --- */
  #animal-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    position: relative;
  }
  #animal-emoji {
    font-size: clamp(5rem, 16vw, 10rem);
    line-height: 1;
    transition: transform .3s;
  }
  #animal-name {
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    font-weight: 800;
    color: #4e342e;
  }
  #prompt {
    font-size: clamp(1rem, 3vw, 1.5rem);
    color: #777;
    font-weight: 600;
  }
  #plate {
    display: flex;
    gap: 4px;
    min-height: clamp(2rem, 5vw, 3rem);
    justify-content: center;
    flex-wrap: wrap;
  }
  .plate-item {
    font-size: clamp(1.8rem, 5vw, 3rem);
    animation: popIn .3s ease;
  }
  @keyframes popIn {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* --- Food Grid --- */
  #foods {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(8px, 2vw, 16px);
    max-width: 95vw;
  }

  .food-btn {
    width: clamp(75px, 18vw, 130px);
    height: clamp(75px, 18vw, 130px);
    background: #fff;
    border: 4px solid #e0e0e0;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2.5rem, 7vw, 4.5rem);
    cursor: pointer;
    transition: transform .15s, opacity .2s, border-color .15s;
    box-shadow: 0 4px 14px rgba(0,0,0,.1);
    -webkit-tap-highlight-color: transparent;
  }
  .food-btn:active { transform: scale(.93); }
  .food-btn.correct {
    border-color: #66bb6a;
    opacity: .35;
    pointer-events: none;
    transform: scale(.85);
  }
  .food-btn.wrong {
    animation: shake .4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%  { transform: translateX(-14px); }
    40%  { transform: translateX(14px); }
    60%  { transform: translateX(-8px); }
    80%  { transform: translateX(8px); }
  }

  /* --- Reaction Overlay --- */
  #reaction {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(5rem, 18vw, 11rem);
    z-index: 2000;
    pointer-events: none;
    opacity: 0;
    transition: transform .25s ease, opacity .25s;
  }
  #reaction.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* --- Celebration --- */
  #celebration {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.5);
    z-index: 3000;
  }
  #celebration.show { display: flex; }
  #celebration .big-stars {
    font-size: clamp(3rem, 10vw, 6rem);
    animation: pop .6s ease .1s both;
  }
  #celebration .msg {
    font-size: clamp(1.8rem, 6vw, 3.8rem);
    color: #fff;
    font-weight: 900;
    text-shadow: 3px 3px 0 #e65100;
    text-align: center;
    animation: pop .5s ease;
    margin: 8px 0;
  }
  #play-again {
    margin-top: 20px;
    padding: 18px 50px;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #66bb6a, #ffca28);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    animation: pop .6s ease .25s both;
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* --- Next animal transition --- */
  #animal-emoji.happy {
    animation: wiggle .5s ease;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25%  { transform: rotate(-10deg) scale(1.1); }
    75%  { transform: rotate(10deg) scale(1.1); }
  }

  .confetti {
    position: fixed;
    border-radius: 2px;
    z-index: 3001;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div id="game">
  <h1>🍽️ Feed the Animal!</h1>
  <div id="progress"></div>
  <div id="animal-area">
    <div id="animal-emoji"></div>
    <div id="animal-name"></div>
    <div id="prompt">Tap the yummy foods!</div>
    <div id="plate"></div>
  </div>
  <div id="foods"></div>
</div>

<div id="reaction"></div>

<div id="celebration">
  <div class="big-stars">🎉🍽️🎉</div>
  <div class="msg">All Animals Fed!</div>
  <div class="big-stars">⭐👨‍🍳⭐</div>
  <button id="play-again">Play Again!</button>
</div>

<script>
const ANIMALS = [
  { emoji: '🐮', name: 'Cow',      foods: ['🌿','🌾','🌽'],  wrong: ['🥩','🍗','🍌'] },
  { emoji: '🐯', name: 'Tiger',    foods: ['🥩','🐟','🍗'],  wrong: ['🌿','🥕','🌽'] },
  { emoji: '🐰', name: 'Bunny',    foods: ['🥕','🥬','🍎'],  wrong: ['🥩','🦴','🍗'] },
  { emoji: '🐵', name: 'Monkey',   foods: ['🍌','🥭','🥜'],  wrong: ['🐟','🦴','🌾'] },
  { emoji: '🐻', name: 'Bear',     foods: ['🍯','🐟','🫐'],  wrong: ['🌾','🥬','🎋'] },
  { emoji: '🐶', name: 'Dog',      foods: ['🦴','🥩','🍪'],  wrong: ['🌿','🎋','🫐'] },
  { emoji: '🐱', name: 'Cat',      foods: ['🐟','🥛','🍗'],  wrong: ['🌽','🍌','🌾'] },
  { emoji: '🐷', name: 'Pig',      foods: ['🍎','🌽','🌰'],  wrong: ['🐟','🦴','🥛'] },
  { emoji: '🐴', name: 'Horse',    foods: ['🍎','🌾','🥕'],  wrong: ['🥩','🍯','🍗'] },
  { emoji: '🐼', name: 'Panda',    foods: ['🎋','🍎','🌿'],  wrong: ['🥩','🍗','🦴'] },
  { emoji: '🐧', name: 'Penguin',  foods: ['🐟','🦐','🦑'],  wrong: ['🍌','🌽','🍪'] },
  { emoji: '🐘', name: 'Elephant', foods: ['🥜','🍌','🌿'],  wrong: ['🥩','🐟','🍗'] },
];

const ROUNDS = 5;
let queue = [];
let roundIndex = 0;
let foundCount = 0;
let waiting = false;

const animalEmoji = document.getElementById('animal-emoji');
const animalNameEl = document.getElementById('animal-name');
const plateEl     = document.getElementById('plate');
const foodsEl     = document.getElementById('foods');
const progressEl  = document.getElementById('progress');
const reactionEl  = document.getElementById('reaction');
const celebrationEl = document.getElementById('celebration');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  queue = shuffle(ANIMALS).slice(0, ROUNDS);
  roundIndex = 0;
  progressEl.textContent = '';
  celebrationEl.classList.remove('show');
  showAnimal();
}

function showAnimal() {
  const a = queue[roundIndex];
  foundCount = 0;
  animalEmoji.textContent = a.emoji;
  animalEmoji.style.transform = 'scale(0)';
  requestAnimationFrame(() => { animalEmoji.style.transform = 'scale(1)'; });
  animalNameEl.textContent = a.name + ' is hungry!';
  plateEl.innerHTML = '';

  const allFoods = shuffle([...a.foods, ...a.wrong]);
  foodsEl.innerHTML = '';
  allFoods.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'food-btn';
    btn.textContent = f;
    btn.dataset.food = f;
    btn.dataset.correct = a.foods.includes(f) ? '1' : '0';
    btn.addEventListener('click', () => handleTap(btn, a));
    foodsEl.appendChild(btn);
  });
}

function handleTap(btn, animal) {
  if (waiting || btn.classList.contains('correct')) return;

  if (btn.dataset.correct === '1') {
    btn.classList.add('correct');
    const item = document.createElement('span');
    item.className = 'plate-item';
    item.textContent = btn.dataset.food;
    plateEl.appendChild(item);
    showReaction('😋');
    foundCount++;

    if (foundCount === animal.foods.length) {
      waiting = true;
      progressEl.textContent += '⭐';
      animalEmoji.classList.add('happy');
      animalEmoji.addEventListener('animationend', () => animalEmoji.classList.remove('happy'), { once: true });

      roundIndex++;
      if (roundIndex < queue.length) {
        setTimeout(() => {
          waiting = false;
          showAnimal();
        }, 1000);
      } else {
        setTimeout(() => {
          celebrationEl.classList.add('show');
          spawnConfetti();
        }, 800);
      }
    }
  } else {
    btn.classList.add('wrong');
    showReaction('🙊');
    btn.addEventListener('animationend', () => btn.classList.remove('wrong'), { once: true });
  }
}

function showReaction(emoji) {
  reactionEl.textContent = emoji;
  reactionEl.classList.add('show');
  setTimeout(() => reactionEl.classList.remove('show'), 700);
}

function spawnConfetti() {
  const colors = ['#66bb6a','#ffca28','#42a5f5','#ff7043','#ab47bc','#ef5350'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = -20 + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * .8) + 's';
    c.style.width = (8 + Math.random() * 10) + 'px';
    c.style.height = (8 + Math.random() * 10) + 'px';
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

document.getElementById('play-again').addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
