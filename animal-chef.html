<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Animal Chef!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fff9c4 0%, #c8e6c9 50%, #ffe0b2 100%);
    user-select: none;
    -webkit-user-select: none;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: clamp(5px, 1.2vh, 12px);
    padding: 6px;
  }

  h1 {
    font-size: clamp(1.2rem, 4vw, 2.2rem);
    color: #e65100;
    text-shadow: 2px 2px 0 #fff;
  }

  /* --- Animal + label --- */
  #animal-row {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 16px);
  }
  #animal-emoji {
    font-size: clamp(4rem, 12vw, 7rem);
    line-height: 1;
    transition: transform .3s;
  }
  #animal-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  #animal-name {
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 800;
    color: #4e342e;
  }
  #food-label {
    font-size: clamp(1rem, 3vw, 1.5rem);
    font-weight: 700;
    color: #777;
  }

  /* --- Current food + selector --- */
  #food-row {
    display: flex;
    align-items: center;
    gap: clamp(10px, 3vw, 20px);
  }
  #current-food {
    font-size: clamp(3.5rem, 10vw, 6rem);
    line-height: 1;
    transition: transform .3s;
  }
  .sel-btn {
    width: clamp(56px, 13vw, 90px);
    height: clamp(56px, 13vw, 90px);
    border: none;
    border-radius: 50%;
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .1s;
    -webkit-tap-highlight-color: transparent;
    line-height: 1;
  }
  .sel-btn:active { transform: scale(.9); }
  #btn-minus { background: linear-gradient(135deg, #ef5350, #ff7043); box-shadow: 0 4px 12px rgba(239,83,80,.3); }
  #btn-plus  { background: linear-gradient(135deg, #66bb6a, #81c784); box-shadow: 0 4px 12px rgba(102,187,106,.3); }
  #num-display {
    font-size: clamp(3.5rem, 10vw, 6rem);
    font-weight: 900;
    color: #e65100;
    min-width: 1.2em;
    text-align: center;
    text-shadow: 2px 2px 0 #fff;
  }

  /* --- Bowl --- */
  #bowl-area {
    position: relative;
    width: clamp(180px, 45vw, 340px);
    height: clamp(120px, 26vw, 220px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #bowl {
    font-size: clamp(7rem, 24vw, 13rem);
    line-height: 1;
    z-index: 1;
  }
  #items-in-bowl {
    position: absolute;
    bottom: clamp(32px, 8vw, 64px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1px;
    width: 55%;
    z-index: 2;
    pointer-events: none;
  }
  .bowl-item {
    font-size: clamp(1.2rem, 3.2vw, 2rem);
    animation: popIn .3s ease;
  }
  @keyframes popIn {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* --- Counter --- */
  #counter {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 900;
    color: #e65100;
    text-shadow: 3px 3px 0 #fff;
    min-height: 1.2em;
    text-align: center;
  }

  /* --- GO button --- */
  #go-btn {
    padding: clamp(12px, 2.5vh, 20px) clamp(44px, 10vw, 80px);
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 900;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff6f00, #ffa726);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,111,0,.4);
    transition: transform .15s;
    -webkit-tap-highlight-color: transparent;
  }
  #go-btn:active { transform: scale(.95); }
  #go-btn:disabled { opacity: .5; cursor: default; }
  #go-btn:disabled:active { transform: none; }

  /* --- Food progress dots --- */
  #food-progress {
    display: flex;
    gap: clamp(6px, 2vw, 14px);
    align-items: center;
  }
  .food-dot {
    font-size: clamp(1.8rem, 5vw, 3rem);
    opacity: .3;
    transition: opacity .3s, transform .3s;
  }
  .food-dot.done {
    opacity: 1;
    transform: scale(1.1);
  }
  .food-dot.active {
    opacity: 1;
    animation: pulse 1s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  /* --- Floating item --- */
  #floating-item {
    position: fixed;
    font-size: clamp(2.5rem, 7vw, 4.5rem);
    z-index: 100;
    pointer-events: none;
    opacity: 0;
  }

  /* --- Celebration --- */
  #celebration {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.5);
    z-index: 3000;
  }
  #celebration.show { display: flex; }
  #celebration .big-stars {
    font-size: clamp(3rem, 10vw, 6rem);
    animation: pop .6s ease .1s both;
  }
  #celebration .msg {
    font-size: clamp(1.6rem, 5.5vw, 3.5rem);
    color: #fff;
    font-weight: 900;
    text-shadow: 3px 3px 0 #e65100;
    text-align: center;
    animation: pop .5s ease;
    margin: 8px 0;
  }
  #cel-msg { white-space: pre-line; }
  #play-again {
    margin-top: 20px;
    padding: 18px 50px;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #66bb6a, #ffca28);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    animation: pop .6s ease .25s both;
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  #animal-emoji.happy { animation: wiggle .5s ease; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25%  { transform: rotate(-10deg) scale(1.1); }
    75%  { transform: rotate(10deg) scale(1.1); }
  }

  .confetti {
    position: fixed;
    border-radius: 2px;
    z-index: 3001;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div id="game">
  <h1>🍽️ Animal Chef!</h1>

  <div id="animal-row">
    <div id="animal-emoji"></div>
    <div id="animal-info">
      <div id="animal-name"></div>
      <div id="food-label"></div>
    </div>
  </div>

  <div id="food-progress"></div>

  <div id="food-row">
    <div id="current-food"></div>
    <button class="sel-btn" id="btn-minus">−</button>
    <div id="num-display">3</div>
    <button class="sel-btn" id="btn-plus">+</button>
  </div>

  <div id="bowl-area">
    <div id="items-in-bowl"></div>
    <div id="bowl">🥣</div>
  </div>

  <div id="counter"></div>

  <button id="go-btn">GO!</button>
</div>

<div id="floating-item"></div>

<div id="celebration">
  <div class="big-stars">🎉🍽️🎉</div>
  <div class="msg" id="cel-msg"></div>
  <div class="big-stars">⭐👨‍🍳⭐</div>
  <button id="play-again">Cook Again!</button>
</div>

<script>
// --- Audio ---
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playPlop() {
  initAudio();
  const ctx = audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(300, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.6, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.25);
}
function playTada() {
  initAudio();
  const ctx = audioCtx;
  [523,659,784].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'triangle';
    const t = ctx.currentTime + i * 0.15;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.4, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
    osc.start(t);
    osc.stop(t + 0.4);
  });
}

// --- Data ---
const ANIMALS = [
  { emoji: '🐮', name: 'Cow',      foods: ['🌿','🌾','🌽'] },
  { emoji: '🐯', name: 'Tiger',    foods: ['🥩','🐟','🍗'] },
  { emoji: '🐰', name: 'Bunny',    foods: ['🥕','🥬','🍎'] },
  { emoji: '🐵', name: 'Monkey',   foods: ['🍌','🥭','🥜'] },
  { emoji: '🐻', name: 'Bear',     foods: ['🍯','🐟','🫐'] },
  { emoji: '🐶', name: 'Dog',      foods: ['🦴','🥩','🍪'] },
  { emoji: '🐱', name: 'Cat',      foods: ['🐟','🥛','🍗'] },
  { emoji: '🐷', name: 'Pig',      foods: ['🍎','🌽','🌰'] },
  { emoji: '🐴', name: 'Horse',    foods: ['🍎','🌾','🥕'] },
  { emoji: '🐼', name: 'Panda',    foods: ['🎋','🍎','🌿'] },
  { emoji: '🐧', name: 'Penguin',  foods: ['🐟','🦐','🦑'] },
  { emoji: '🐘', name: 'Elephant', foods: ['🥜','🍌','🌿'] },
];

// --- State ---
let animal = null;
let foodIndex = 0;
let count = 3;
let running = false;

// --- Elements ---
const animalEmoji   = document.getElementById('animal-emoji');
const animalNameEl  = document.getElementById('animal-name');
const foodLabelEl   = document.getElementById('food-label');
const foodProgressEl = document.getElementById('food-progress');
const currentFoodEl = document.getElementById('current-food');
const numDisplay    = document.getElementById('num-display');
const btnMinus      = document.getElementById('btn-minus');
const btnPlus       = document.getElementById('btn-plus');
const goBtn         = document.getElementById('go-btn');
const bowlArea      = document.getElementById('bowl-area');
const itemsInBowl   = document.getElementById('items-in-bowl');
const floatingItem  = document.getElementById('floating-item');
const counterEl     = document.getElementById('counter');
const celebrationEl = document.getElementById('celebration');
const celMsg        = document.getElementById('cel-msg');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  animal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  foodIndex = 0;
  itemsInBowl.innerHTML = '';
  celebrationEl.classList.remove('show');
  animalEmoji.textContent = animal.emoji;
  animalEmoji.style.transform = 'scale(0)';
  requestAnimationFrame(() => { animalEmoji.style.transform = 'scale(1)'; });
  animalNameEl.textContent = animal.name + ' is hungry!';
  buildFoodProgress();
  showFood();
}

function buildFoodProgress() {
  foodProgressEl.innerHTML = '';
  animal.foods.forEach((f, i) => {
    const dot = document.createElement('span');
    dot.className = 'food-dot';
    dot.textContent = f;
    dot.dataset.index = i;
    foodProgressEl.appendChild(dot);
  });
}

function showFood() {
  const food = animal.foods[foodIndex];
  currentFoodEl.textContent = food;
  currentFoodEl.style.transform = 'scale(0)';
  requestAnimationFrame(() => { currentFoodEl.style.transform = 'scale(1)'; });
  floatingItem.textContent = food;
  foodLabelEl.textContent = `Add some ${food}`;
  count = 3;
  numDisplay.textContent = count;
  counterEl.textContent = '';
  running = false;
  goBtn.disabled = false;
  btnMinus.disabled = false;
  btnPlus.disabled = false;

  // Update progress dots
  foodProgressEl.querySelectorAll('.food-dot').forEach((dot, i) => {
    dot.classList.remove('active', 'done');
    if (i < foodIndex) dot.classList.add('done');
    if (i === foodIndex) dot.classList.add('active');
  });
}

// --- Selector ---
btnMinus.addEventListener('click', () => {
  if (running || count <= 1) return;
  count--;
  numDisplay.textContent = count;
});
btnPlus.addEventListener('click', () => {
  if (running || count >= 9) return;
  count++;
  numDisplay.textContent = count;
});

// --- GO ---
goBtn.addEventListener('click', () => {
  if (running) return;
  initAudio();
  running = true;
  goBtn.disabled = true;
  btnMinus.disabled = true;
  btnPlus.disabled = true;
  dropItems(count);
});

async function dropItems(total) {
  const emoji = animal.foods[foodIndex];
  const foodRect = currentFoodEl.getBoundingClientRect();
  const fromX = foodRect.left + foodRect.width / 2;
  const fromY = foodRect.top + foodRect.height / 2;
  const bowlRect = bowlArea.getBoundingClientRect();
  const toX = bowlRect.left + bowlRect.width / 2;
  const toY = bowlRect.top + bowlRect.height * 0.25;

  for (let i = 1; i <= total; i++) {
    await animateDrop(fromX, fromY, toX, toY, i, total, emoji);
    await sleep(400);
  }

  // Mark this food done
  foodProgressEl.querySelectorAll('.food-dot')[foodIndex].classList.remove('active');
  foodProgressEl.querySelectorAll('.food-dot')[foodIndex].classList.add('done');

  foodIndex++;
  if (foodIndex < animal.foods.length) {
    setTimeout(() => showFood(), 600);
  } else {
    // All foods done - celebrate!
    animalEmoji.classList.add('happy');
    animalEmoji.addEventListener('animationend', () => animalEmoji.classList.remove('happy'), { once: true });
    setTimeout(() => {
      playTada();
      celMsg.textContent = `${animal.emoji} ${animal.name} says YUM!\nYou cooked a great meal!`;
      celebrationEl.classList.add('show');
      spawnConfetti();
    }, 500);
  }
}

function animateDrop(fromX, fromY, toX, toY, num, total, emoji) {
  return new Promise(resolve => {
    const el = floatingItem;
    const w = el.offsetWidth / 2;
    const h = el.offsetHeight / 2;

    el.style.transition = 'none';
    el.style.left = (fromX - w) + 'px';
    el.style.top = (fromY - h) + 'px';
    el.style.opacity = '1';

    requestAnimationFrame(() => {
      el.style.transition = 'left 0.4s ease-in, top 0.4s ease-in';
      el.style.left = (toX - w) + 'px';
      el.style.top = (toY - h) + 'px';
    });

    setTimeout(() => {
      el.style.opacity = '0';
      playPlop();

      const e = document.createElement('span');
      e.className = 'bowl-item';
      e.textContent = emoji;
      itemsInBowl.appendChild(e);

      counterEl.textContent = num + (num < total ? '...' : '!');
      resolve();
    }, 450);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// --- Cook Again ---
document.getElementById('play-again').addEventListener('click', startGame);

function spawnConfetti() {
  const colors = ['#66bb6a','#ffca28','#42a5f5','#ff7043','#ab47bc','#ef5350'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = -20 + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * .8) + 's';
    c.style.width = (8 + Math.random() * 10) + 'px';
    c.style.height = (8 + Math.random() * 10) + 'px';
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

startGame();
</script>
</body>
</html>
