<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assalamualaikum! 🌙</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #84fab0, #8fd3f4);
      background-size: 400% 400%;
      animation: rainbowBG 15s ease infinite;
      overflow: hidden;
      text-align: center;
    }

    @keyframes rainbowBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: clamp(2rem, 9vw, 5.5rem);
      animation: bounce 2s ease-in-out infinite;
    }

    h1 span {
      display: inline-block;
      animation: wiggle 2s ease-in-out infinite;
      text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.15);
    }

    /* A different bright color for each letter (cycled) */
    h1 span:nth-child(8n+1) { color: #ff1744; }
    h1 span:nth-child(8n+2) { color: #ff9100; }
    h1 span:nth-child(8n+3) { color: #ffd600; }
    h1 span:nth-child(8n+4) { color: #00e676; }
    h1 span:nth-child(8n+5) { color: #00b0ff; }
    h1 span:nth-child(8n+6) { color: #d500f9; }
    h1 span:nth-child(8n+7) { color: #ff4081; }
    h1 span:nth-child(8n+8) { color: #1de9b6; }

    /* Stagger the wiggle so it looks playful */
    h1 span:nth-child(1)  { animation-delay: 0.00s; }
    h1 span:nth-child(2)  { animation-delay: 0.08s; }
    h1 span:nth-child(3)  { animation-delay: 0.16s; }
    h1 span:nth-child(4)  { animation-delay: 0.24s; }
    h1 span:nth-child(5)  { animation-delay: 0.32s; }
    h1 span:nth-child(6)  { animation-delay: 0.40s; }
    h1 span:nth-child(7)  { animation-delay: 0.48s; }
    h1 span:nth-child(8)  { animation-delay: 0.56s; }
    h1 span:nth-child(9)  { animation-delay: 0.64s; }
    h1 span:nth-child(10) { animation-delay: 0.72s; }
    h1 span:nth-child(11) { animation-delay: 0.80s; }
    h1 span:nth-child(12) { animation-delay: 0.88s; }
    h1 span:nth-child(13) { animation-delay: 0.96s; }
    h1 span:nth-child(14) { animation-delay: 1.04s; }
    h1 span:nth-child(15) { animation-delay: 1.12s; }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-8deg) translateY(0); }
      50%      { transform: rotate(8deg) translateY(-10px); }
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    .emojis {
      font-size: clamp(2rem, 8vw, 4rem);
      margin-top: 1.5rem;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .subtitle {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 4vw, 1.8rem);
      color: #fff;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
    }

    .fart-btn {
      margin-top: 2rem;
      font-family: inherit;
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 800;
      color: #4a3080;
      background: #ffd600;
      border: none;
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #c7a800, 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      user-select: none;
    }

    .fart-btn:hover {
      transform: translateY(-2px);
    }

    .fart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c7a800, 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    .animal-btn {
      margin-top: 1rem;
      font-family: inherit;
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 800;
      color: #fff;
      background: #00b0ff;
      border: none;
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #0081cb, 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      user-select: none;
    }

    .animal-btn:hover {
      transform: translateY(-2px);
    }

    .animal-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0081cb, 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    .animal-display {
      margin-top: 1rem;
      font-size: clamp(2.5rem, 10vw, 5rem);
      min-height: 1.2em;
    }

    .shrink-btn {
      margin-top: 1rem;
      font-family: inherit;
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 800;
      color: #fff;
      background: #d500f9;
      border: none;
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #9c00b8, 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      user-select: none;
    }

    .shrink-btn:hover {
      transform: translateY(-2px);
    }

    .shrink-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #9c00b8, 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    /* The shrink-ray target: everything inside this wrapper scales smoothly */
    #stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center center;
    }

    #stage.shrunk {
      transform: scale(0.15);
    }

    /* Quick zap flash when the ray fires */
    @keyframes zapFlash {
      0%   { opacity: 0; }
      30%  { opacity: 0.85; }
      100% { opacity: 0; }
    }

    #zap {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #fff 0%, #d500f9 60%, transparent 100%);
      pointer-events: none;
      opacity: 0;
    }

    #zap.fire {
      animation: zapFlash 0.4s ease-out;
    }

    .funny-btn {
      margin-top: 1rem;
      font-family: inherit;
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 800;
      color: #4a3080;
      background: #00e676;
      border: none;
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #00a152, 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      user-select: none;
    }

    .funny-btn:hover {
      transform: translateY(-2px);
    }

    .funny-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #00a152, 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    .joke {
      margin-top: 1rem;
      max-width: 90vw;
      font-size: clamp(1rem, 3.5vw, 1.5rem);
      color: #4a3080;
      background: rgba(255, 255, 255, 0.85);
      padding: 0.8rem 1.4rem;
      border-radius: 20px;
      min-height: 1.2em;
    }

    /* Emoji confetti that falls when you press Funny */
    .confetti {
      position: fixed;
      top: -10vh;
      font-size: 2.5rem;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 5;
    }

    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120vh) rotate(720deg); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="zap"></div>

  <div id="stage">
    <h1>
      <span>A</span><span>s</span><span>s</span><span>a</span><span>l</span><span>a</span><span>m</span><span>u</span><span>a</span><span>l</span><span>a</span><span>i</span><span>k</span><span>u</span><span>m</span>
    </h1>
    <div class="emojis">🌙 ⭐ 🕌 🌟 ✨</div>
    <p class="subtitle">Peace be upon you! 🎉</p>
    <button class="fart-btn" onclick="playFart()">💨 Press me!</button>
    <button class="animal-btn" onclick="playAnimal()">🐮 Animal sound!</button>
    <div class="animal-display" id="animalDisplay"></div>
    <button class="shrink-btn" onclick="shrinkRay()">🔫 Shrink Ray!</button>
    <button class="funny-btn" onclick="beFunny()">😜 Funny!</button>
    <div class="joke" id="joke"></div>
  </div>

  <script>
    function playFart() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      const duration = 0.45 + Math.random() * 0.25;

      // Wobbly low-frequency tone = the "brap"
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      const startFreq = 90 + Math.random() * 40;
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(startFreq * 0.4, now + duration);

      // Vibrato to make it sputter
      const lfo = ctx.createOscillator();
      lfo.type = 'square';
      lfo.frequency.setValueAtTime(18 + Math.random() * 12, now);
      const lfoGain = ctx.createGain();
      lfoGain.gain.setValueAtTime(30, now);
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);

      // Volume envelope
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.6, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      // A little low-pass filter to keep it rounded
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, now);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      lfo.start(now);
      osc.stop(now + duration);
      lfo.stop(now + duration);

      osc.onended = () => ctx.close();
    }

    // A few animals, each synthesized from simple oscillator "notes".
    const animals = [
      {
        emoji: '🐮', name: 'Moo',
        play: (ctx, t) => tone(ctx, t, 'sawtooth', [[150, 0], [110, 0.7]], 0.8, 600)
      },
      {
        emoji: '🐱', name: 'Meow',
        play: (ctx, t) => tone(ctx, t, 'sawtooth', [[600, 0], [900, 0.15], [500, 0.4]], 0.4, 1800)
      },
      {
        emoji: '🐶', name: 'Woof',
        play: (ctx, t) => { tone(ctx, t, 'square', [[200, 0], [120, 0.18]], 0.18, 900);
                            tone(ctx, t + 0.25, 'square', [[200, 0], [120, 0.18]], 0.18, 900); }
      },
      {
        emoji: '🦆', name: 'Quack',
        play: (ctx, t) => { tone(ctx, t, 'square', [[400, 0], [300, 0.12]], 0.12, 1500);
                            tone(ctx, t + 0.18, 'square', [[420, 0], [320, 0.12]], 0.12, 1500); }
      },
      {
        emoji: '🐑', name: 'Baa',
        play: (ctx, t) => tone(ctx, t, 'sawtooth', [[350, 0], [320, 0.2], [380, 0.5]], 0.6, 1400, 14)
      },
      {
        emoji: '🐦', name: 'Tweet',
        play: (ctx, t) => { tone(ctx, t, 'sine', [[1800, 0], [2600, 0.1]], 0.1, 4000);
                            tone(ctx, t + 0.14, 'sine', [[2000, 0], [2800, 0.1]], 0.1, 4000); }
      }
    ];

    // Helper: play one oscillator note with a frequency curve + envelope.
    function tone(ctx, startAt, type, freqPoints, duration, cutoff, vibratoHz) {
      const osc = ctx.createOscillator();
      osc.type = type;
      const base = freqPoints[0][0];
      osc.frequency.setValueAtTime(base, startAt);
      for (let i = 1; i < freqPoints.length; i++) {
        const [freq, dt] = freqPoints[i];
        osc.frequency.linearRampToValueAtTime(freq, startAt + dt);
      }

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.001, startAt);
      gain.gain.exponentialRampToValueAtTime(0.5, startAt + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(cutoff, startAt);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      if (vibratoHz) {
        const lfo = ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(vibratoHz, startAt);
        const lfoGain = ctx.createGain();
        lfoGain.gain.setValueAtTime(25, startAt);
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start(startAt);
        lfo.stop(startAt + duration);
      }

      osc.start(startAt);
      osc.stop(startAt + duration);
    }

    function playAnimal() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const animal = animals[Math.floor(Math.random() * animals.length)];
      animal.play(ctx, ctx.currentTime);

      const display = document.getElementById('animalDisplay');
      display.textContent = animal.emoji + ' ' + animal.name + '!';

      // Close the context once everything has finished playing.
      setTimeout(() => ctx.close(), 1500);
    }

    // Shrink ray: toggles everything between tiny and normal, with a laser zap.
    function shrinkRay() {
      const stage = document.getElementById('stage');
      const zap = document.getElementById('zap');

      // Fire the flash overlay.
      zap.classList.remove('fire');
      void zap.offsetWidth; // restart the animation
      zap.classList.add('fire');

      // Laser "pew" sound: a fast downward (or upward) frequency sweep.
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      const shrinking = !stage.classList.contains('shrunk');

      const osc = ctx.createOscillator();
      osc.type = 'square';
      if (shrinking) {
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.5);
      } else {
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
      }

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.4, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
      osc.onended = () => ctx.close();

      // Toggle the size.
      stage.classList.toggle('shrunk');
    }

    // Funny button: tells a random kid joke, rains emojis, and giggles.
    const jokes = [
      'Why did the banana go to the doctor? Because it wasn’t peeling well! 🍌',
      'What do you call a sleeping dinosaur? A dino-snore! 🦕',
      'Why did the cookie go to the hospital? It felt crummy! 🍪',
      'What do you call a bear with no teeth? A gummy bear! 🐻',
      'Why can’t your nose be 12 inches long? Because then it would be a foot! 👃',
      'What did one wall say to the other? Meet you at the corner! 🧱',
      'Why did the chicken cross the playground? To get to the other slide! 🐔',
      'What do you call cheese that isn’t yours? Nacho cheese! 🧀',
      'Why was the math book sad? It had too many problems! 📚',
      'What’s an alligator in a vest called? An investi-gator! 🐊'
    ];
    const confettiEmojis = ['😂', '🤪', '😜', '🎉', '🥳', '😆', '🤡', '⭐', '🌈'];

    function beFunny() {
      // Pick and show a random joke.
      const joke = document.getElementById('joke');
      joke.textContent = jokes[Math.floor(Math.random() * jokes.length)];

      // Rain emoji confetti.
      for (let i = 0; i < 25; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
        c.style.left = Math.random() * 100 + 'vw';
        c.style.fontSize = (1.5 + Math.random() * 2.5) + 'rem';
        c.style.animationDuration = (2 + Math.random() * 2) + 's';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4500);
      }

      // Silly giggle: a few quick rising "hee hee" blips.
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      for (let i = 0; i < 5; i++) {
        const t = now + i * 0.13;
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500 + i * 80, t);
        osc.frequency.linearRampToValueAtTime(750 + i * 80, t + 0.08);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.1);
      }
      setTimeout(() => ctx.close(), 1200);
    }
  </script>
</body>
</html>
